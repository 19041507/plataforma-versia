# Blueprint Render (opcional) — serviço web Python
# Repo: defina Root Directory = plataforma-versia/backend ao criar manualmente.
services:
  - type: web
    name: versia-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate_schemas --shared --noinput && python manage.py migrate_schemas --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health/
