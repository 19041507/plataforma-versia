# ============================================
# Plataforma Versia — Docker Compose PRODUÇÃO
# ============================================
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# Pré-requisitos:
#   1. Arquivo .env na raiz com todas as variáveis
#   2. DNS apontando para o IP da VPS
# ============================================

services:

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: versia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - versia_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (Django + Gunicorn) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: versia_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - versia_net

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: versia_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - versia_net

  # ---- Nginx (Reverse Proxy) ----
  nginx:
    image: nginx:1.27-alpine
    container_name: versia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - backend_static:/app/backend/staticfiles:ro
      - backend_media:/app/backend/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - versia_net

  # ---- Certbot (SSL/HTTPS gratuito) ----
  certbot:
    image: certbot/certbot
    container_name: versia_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renovação manual: docker compose -f docker-compose.prod.yml run certbot renew
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h; done'"

volumes:
  postgres_data:
  backend_static:
  backend_media:
  certbot_www:
  certbot_conf:

networks:
  versia_net:
    driver: bridge
